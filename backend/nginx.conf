# ==============================================================================
# IceStream High Availability Backend Load Balancer (Nginx Reverse Proxy)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    upstream icestream_backend_cluster {
        least_conn;
        server backend1:8000 max_fails=3 fail_timeout=10s;
        server backend2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Gzip compression
        gzip on;
        gzip_types application/json text/plain application/javascript;

        # Load-balanced proxy to FastAPI backend workers
        location / {
            proxy_pass http://icestream_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP/1.1 keep-alive settings
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Health check failover timeout
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Dedicated Health Endpoint for Load Balancer
        location /lb-health {
            access_log off;
            return 200 "OK - IceStream Load Balancer Active\n";
            add_header Content-Type text/plain;
        }
    }
}
