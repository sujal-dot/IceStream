# ==============================================================================
# IceStream - Real-Time Lakehouse Observability & Self-Healing Data Pipeline
# ==============================================================================
# DAY 2 LOCAL DOCKER INFRASTRUCTURE SPECIFICATION
#
# Infrastructure Services:
#   - Kafka (KRaft mode broker)
#   - MinIO (S3-compatible object store)
#   - PostgreSQL (Metadata & incident store)
#   - Flink JobManager & TaskManager (Stream processing cluster)
#   - Prometheus (Metrics collection)
#   - Grafana (Telemetry dashboard)
# ==============================================================================

name: icestream

services:
  # ----------------------------------------------------------------------------
  # Apache Kafka - Distributed Event Streaming (KRaft Mode)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: icestream-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - icestream_kafka_data:/var/lib/kafka/data
    networks:
      - icestream-network

  # ----------------------------------------------------------------------------
  # MinIO - S3-Compatible Object Store for Apache Iceberg
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: icestream-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-icestream_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - icestream_minio_data:/data
    networks:
      - icestream-network

  # ----------------------------------------------------------------------------
  # Apache Iceberg REST Catalog Service
  # ----------------------------------------------------------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:0.1.0
    container_name: icestream-iceberg-rest
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      CATALOG_NAME: icestream
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER:-icestream_minio}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-icestream_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8181' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - icestream-network

  # ----------------------------------------------------------------------------
  # PostgreSQL - Operational Metadata & Incident Log Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: icestream-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-icestream_db}
      POSTGRES_USER: ${POSTGRES_USER:-icestream_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icestream_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-icestream_user} -d ${POSTGRES_DB:-icestream_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - icestream_postgres_data:/var/lib/postgresql/data
    networks:
      - icestream-network

  # ----------------------------------------------------------------------------
  # Apache Flink JobManager - Stream Processing Coordinator
  # ----------------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: icestream-flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      ENABLE_BUILT_IN_PLUGINS: "flink-s3-fs-hadoop-1.18.1.jar"
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-icestream_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER:-icestream_minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
        s3.ssl.enabled: false
        s3.region: us-east-1
        s3a.endpoint: http://minio:9000
        s3a.path.style.access: true
        s3a.access-key: ${MINIO_ROOT_USER:-icestream_minio}
        s3a.secret-key: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
        s3a.ssl.enabled: false
        fs.s3a.endpoint: http://minio:9000
        fs.s3a.path.style.access: true
        fs.s3a.access.key: ${MINIO_ROOT_USER:-icestream_minio}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
        fs.s3a.ssl.enabled: false
        state.backend: filesystem
        state.checkpoints.dir: s3://checkpoints/flink/
        state.savepoints.dir: s3://checkpoints/flink-savepoints/
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: ${FLINK_RESTART_ATTEMPTS:-3}
        restart-strategy.fixed-delay.delay: ${FLINK_RESTART_DELAY_SECONDS:-10}s
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/v1/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar:ro
      - ./flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:ro
      - ./flink/lib/iceberg-aws-bundle-1.5.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.5.2.jar:ro
      - ./flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:ro
    networks:
      - icestream-network

  # ----------------------------------------------------------------------------
  # Apache Flink TaskManager - Stream Processing Execution Worker
  # ----------------------------------------------------------------------------
  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: icestream-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      ENABLE_BUILT_IN_PLUGINS: "flink-s3-fs-hadoop-1.18.1.jar"
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-icestream_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ${MINIO_ROOT_USER:-icestream_minio}
        s3.secret-key: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
        s3.ssl.enabled: false
        s3.region: us-east-1
        s3a.endpoint: http://minio:9000
        s3a.path.style.access: true
        s3a.access-key: ${MINIO_ROOT_USER:-icestream_minio}
        s3a.secret-key: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
        s3a.ssl.enabled: false
        fs.s3a.endpoint: http://minio:9000
        fs.s3a.path.style.access: true
        fs.s3a.access.key: ${MINIO_ROOT_USER:-icestream_minio}
        fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD:-icestream_minio_secret}
        fs.s3a.ssl.enabled: false
        state.backend: filesystem
        state.checkpoints.dir: s3://checkpoints/flink/
        state.savepoints.dir: s3://checkpoints/flink-savepoints/
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: ${FLINK_RESTART_ATTEMPTS:-3}
        restart-strategy.fixed-delay.delay: ${FLINK_RESTART_DELAY_SECONDS:-10}s
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://flink-jobmanager:8081/v1/taskmanagers | grep -q 'taskmanagers' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar:ro
      - ./flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:ro
      - ./flink/lib/iceberg-aws-bundle-1.5.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.5.2.jar:ro
      - ./flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:ro
    networks:
      - icestream-network

  # ----------------------------------------------------------------------------
  # Prometheus - Infrastructure Metrics Collector
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: icestream-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - icestream_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - icestream-network
    extra_hosts:
      - "host.docker.internal:host-gateway"


  # ----------------------------------------------------------------------------
  # Grafana - Infrastructure Metrics Visualization Dashboard
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: icestream-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - icestream_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - icestream-network

networks:
  icestream-network:
    name: icestream-network
    driver: bridge

volumes:
  icestream_kafka_data:
    name: icestream_kafka_data
  icestream_minio_data:
    name: icestream_minio_data
  icestream_postgres_data:
    name: icestream_postgres_data
  icestream_prometheus_data:
    name: icestream_prometheus_data
  icestream_grafana_data:
    name: icestream_grafana_data
