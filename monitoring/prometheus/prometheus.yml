# Prometheus Configuration for IceStream Infrastructure
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'flink-jobmanager'
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['flink-jobmanager:8081']

  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/sys'
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
