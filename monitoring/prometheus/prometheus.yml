# Prometheus Configuration for IceStream Infrastructure
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'icestream-backend'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['icestream-backend:8000']

  # Flink JobManager — native Prometheus metrics endpoint (port 9250)
  # Enabled via: metrics.reporter.prom.factory.class + ENABLE_BUILT_IN_PLUGINS
  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['icestream-flink-jobmanager:9250']

  # Flink TaskManager — native Prometheus metrics endpoint (port 9250)
  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['icestream-flink-taskmanager:9250']

  - job_name: 'grafana'
    static_configs:
      - targets: ['icestream-grafana:3000']
